# FedOS — issue chooser configuration.
#
# `blank_issues_enabled: false` forces every new issue through one of the
# templates below. That matters here for one specific reason: the
# security-report link must be impossible to miss, so that a sensitive
# vulnerability is never filed as a public Issue by accident.
blank_issues_enabled: false

contact_links:
  - name: Report a security vulnerability (PRIVATE — do not open a public Issue)
    # GitHub renders this as "Report a vulnerability" once Private
    # Vulnerability Reporting is enabled in repository Settings ->
    # Security. Until the repository owner enables it, this link will
    # 404 -- see SECURITY.md, which says so plainly rather than
    # pretending the channel is live.
    url: https://github.com/OWNER/REPO/security/advisories/new
    about: >-
      Anything that could let someone read messages they should not read,
      recover a key or Master Seed, impersonate a user, or bypass unlock.
      Use GitHub Private Vulnerability Reporting, NOT a public Issue.
      Never attach private keys, Master Seeds, profile directories,
      message plaintext, Archive exports, or relay credentials.

  - name: Ask a question or discuss a design idea
    url: https://github.com/OWNER/REPO/discussions
    about: >-
      Support questions, setup help, protocol/design discussion, and
      Closed Pilot feedback that is not a specific reproducible bug.
      Requires Discussions to be enabled by the repository owner.

  - name: Closed Pilot documentation
    url: https://github.com/OWNER/REPO/blob/main/docs/pilot/CLOSED_PILOT.md
    about: >-
      What the Closed Pilot is, what is in scope, the known risks, and
      the criteria for stopping use of the build.
