# FedOS Core — minimal Rust crate skeleton (Stage 69) + first dependency
# (Stage 74) + RFC 8439 vectors wired to `cargo test` (Stage 75) + `hkdf`
# dependency adopted (Stage 76) + RFC 5869 HKDF vectors wired to
# `cargo test` (Stage 77) + `zeroize`/`secrecy`/`subtle` secret-handling
# foundation adopted (Stage 78) + `argon2` dependency adopted (Stage 84) +
# `aes-gcm` dependency adopted AND NIST AES-256-GCM vectors wired to
# `cargo test` (Stage 101) + `getrandom` CSPRNG dependency adopted, build
# check ONLY (Stage 104) + `SecretHandle` real-byte storage (Stage 144–146,
# no `Cargo.toml` change) + `sha2` PROMOTED from `[dev-dependencies]` to
# `[dependencies]` (Stage 147) + `k256` secp256k1 dependency ADOPTED
# (Stage 194, minimal `arithmetic`-only feature — no ECDH function, no
# conversation-key derivation, no NIP-44 code; see
# `docs/nip44_dependency_adoption.md` for the full adoption record and
# `docs/nip44_internal_plan.md` for the future ECDH/conversation-key/
# message-key/padding/encrypt/decrypt/NIP-44 stages this dependency
# prepares for, in that fixed order, none of them built yet) + `wasm-bindgen`
# dependency ADOPTED (Stage 985, Prototype EXECUTION Phase 009, pinned
# `0.2.126` — dependency line ONLY; no `#[wasm_bindgen]` attribute anywhere
# in `src/lib.rs`, no new Rust function, Rust public API unchanged at 27
# `pub fn`; see `docs/runtime_wasm_rust_export_bindgen_dependency.md` for the
# full adoption record).
#
# Placeholder crate. There is still NO WASM here — the PUBLIC API in
# `src/lib.rs` is unchanged (placeholder functions only; see
# docs/rust_dependency_adoption.md). Stage 74 added `chacha20poly1305`
# (RustCrypto), wired to the RFC 8439 vectors under `#[cfg(test)]` in
# Stage 75. Stage 76 adopted a SECOND production dependency, `hkdf`
# (RustCrypto), wired to the RFC 5869 HKDF-SHA256 vectors already imported
# at test-vectors/kdf/hkdf-rfc5869.json to a `#[cfg(test)]`-only module in
# Stage 77 — this originally required a concrete hash algorithm to
# instantiate `Hkdf::<Sha256>` ONLY under `#[cfg(test)]`, so `sha2` was
# added ONLY under `[dev-dependencies]` at that time. Stage 147 promotes
# `sha2` to a PRODUCTION dependency (see below) now that `kdf_core` calls
# `hkdf` for real, crate-private HKDF-SHA256 derivation — see
# `docs/hkdf_internal_plan.md` for the full design record. Stage 78 adopted THREE more
# production dependencies together — `zeroize`, `secrecy`, `subtle` — a
# secret-handling FOUNDATION, ahead of any real secret type, in preparation
# for the secret-handle skeleton (Stage 79) and eventual real
# key/seed/plaintext handling. Stage 84 adopts a FIFTH production
# dependency, `argon2` (RustCrypto), preparing for the RFC 9106 Argon2id
# test vectors already imported at test-vectors/kdf/argon2id-rfc9106.json —
# a dependency + build-check ADOPTION ONLY, exactly like every prior
# dependency Stage: no code anywhere in `src/lib.rs` imports, references, or
# calls `argon2`, no vector is wired, and `derive_key_placeholder` is
# unchanged. Stage 101 adopts a SIXTH production dependency, `aes-gcm`
# (RustCrypto), AND — in the same Stage — wires it to the NIST CAVP
# AES-256-GCM known-answer test vectors already imported at
# test-vectors/aead/aes256gcm-nist.json, inside a `#[cfg(test)]`-only
# module with a private, test-only helper pair
# (`seal_aes256gcm_for_test`/`open_aes256gcm_for_test`) — same "wired"
# pattern as `chacha20poly1305`/RFC 8439 (Stage 74/75/81) and
# `argon2`/RFC 9106 (Stage 84/85/86), still no production `aes-gcm` import
# and `encrypt_placeholder`/`decrypt_placeholder` unchanged. Every other
# crypto crate, and bip39 / secp256k1 (beyond `k256`'s own minimal
# `arithmetic` feature) / nostr, remain ABSENT — each lands only in its own
# future, explicitly-reviewed, one-crate-per-stage adoption
# (docs/rust_dependency_adoption.md §1). `wasm-bindgen` is now a DIRECT
# dependency (Stage 985, pinned `0.2.126`) — but strictly a dependency-only
# adoption: no `#[wasm_bindgen]` attribute is applied anywhere, no new Rust
# function exists, and the Rust public API remains 27 `pub fn`, unchanged.

[package]
name = "fedos-core-rust"
version = "0.0.0"
edition = "2021"
publish = false
# Project license, selected by the repository owner (MPL-2.0). The full,
# unmodified official text lives in `LICENSE` at the repository root; the
# decision record is `LICENSE_STATUS.md`. This field covers THIS crate's
# own original source only -- NOT its dependencies (each keeps its own
# license; inventory in `THIRD_PARTY_NOTICES.md`) and NOT the third-party
# test-vector data under `test-vectors/`, which this crate reads via
# `include_str!` from `#[cfg(test)]` modules and which this field does not
# relicense (see `test-vectors/README.md` and `LICENSE_STATUS.md`).
license = "MPL-2.0"

[lib]
# `rlib` (kept, native `cargo test`/`cargo check` link against it) +
# `cdylib` (added, Stage 466) -- the ONLY crate-type that makes `cargo
# build --target wasm32-unknown-unknown` emit a standalone `.wasm`
# binary for `wasm-bindgen` to consume. See
# docs/runtime_wasm_artifact_generation_fix.md for the full record;
# this is the ONE `Cargo.toml` change that document makes -- no
# dependency, feature, or public-API change.
crate-type = ["rlib", "cdylib"]

[dependencies]
# `chacha20poly1305` (RustCrypto, Apache-2.0 OR MIT) — the AEAD this crate will
# eventually implement against the RFC 8439 test vectors already imported at
# test-vectors/aead/chacha20poly1305-rfc8439.json. `default-features = false` +
# `features = ["alloc"]` explicitly excludes the crate's default `getrandom`
# feature (its default-feature OS-RNG convenience) — no random-number source is
# adopted in this stage; CSPRNG adoption is its own future, separate stage
# (docs/fedos_core_rust_safety.md §7, docs/rust_dependency_adoption.md §6).
# NOT imported/used anywhere in src/lib.rs yet — dependency + build check only.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }

# `hkdf` (RustCrypto, MIT OR Apache-2.0) — the extract-and-expand KDF this
# crate implements RFC 5869 HKDF-SHA256 against. Default features are fine
# as-is: `hkdf`'s only optional feature is `kdf` (an unrelated
# trait-abstraction crate), which is NOT enabled here and pulls in no
# `rand`/`getrandom`/`zeroize`. Verified against the RFC 5869 known-answer
# vectors at test-vectors/kdf/hkdf-rfc5869.json inside the `#[cfg(test)]`-only
# `rfc5869_vectors` module since Stage 77. Stage 147 adds the FIRST
# PRODUCTION use: the crate-private `kdf_core` module's
# `derive_secret_handle_internal` calls `Hkdf::<Sha256>::new(...)`/`.expand(...)`
# to derive a `SecretHandle(HkdfOutputMaterial)` from a
# `SecretHandle(HkdfInputMaterial)`, with a fixed, per-`HkdfDomain` salt/info
# — never a caller-supplied salt/info, never a public function (see
# `docs/hkdf_internal_plan.md`).
hkdf = "0.13.0"

# `zeroize` (RustCrypto, Apache-2.0 OR MIT) — clears secret buffers on drop.
# Default features (`alloc`) are used as-is; the `derive` feature (which pulls
# in the `zeroize_derive` proc-macro crate) is deliberately NOT enabled —
# no type in this crate derives `Zeroize` yet. NOT imported/used anywhere in
# src/lib.rs yet — dependency + build check only.
zeroize = "1.9.0"

# `secrecy` (Apache-2.0 OR MIT) — wraps secret values so they are never
# accidentally `Debug`/`Display`-printed, logged, or copied without an
# explicit `expose_secret()` call. Depends only on `zeroize` (already listed
# above); default features are used as-is (its only optional feature,
# `serde`, is NOT enabled). NOT imported/used anywhere in src/lib.rs yet —
# no `Secret`/`SecretBox` type is defined or wrapped — dependency + build
# check only.
secrecy = "0.10.3"

# `subtle` (dalek-cryptography, BSD-3-Clause) — constant-time equality and
# selection, so a future secret-derived byte comparison (e.g. an
# authentication tag) never uses a hand-rolled, timing-variable `==`.
# Default features (`std`, `i128`) are used as-is. NOT imported/used
# anywhere in src/lib.rs yet — no `ConstantTimeEq` call exists — dependency +
# build check only.
subtle = "2.6.1"

# `argon2` (RustCrypto, MIT OR Apache-2.0) — the password-hashing/KDF this
# crate will eventually implement against the RFC 9106 Argon2id test vector
# already imported at test-vectors/kdf/argon2id-rfc9106.json.
# `default-features = false` (no `features` enabled) explicitly excludes the
# crate's default `rand` feature (which pulls in `password-hash`'s optional
# `rand_core` dependency for salt-string generation convenience) and its
# default `alloc`/`password-hash` features (the `PasswordHasher`/PHC-string
# API surface) — none of that is needed to instantiate the low-level
# `Argon2` hasher directly against fixed vector bytes, and no random-number
# source is adopted in this stage (docs/fedos_core_rust_safety.md §7,
# docs/rust_dependency_adoption.md §6). NOT imported/used anywhere in
# src/lib.rs yet — dependency + build check only.
argon2 = { version = "0.5.3", default-features = false }

# `aes-gcm` (RustCrypto, Apache-2.0 OR MIT) — the second AEAD this crate will
# eventually implement against the NIST CAVP AES-256-GCM known-answer test
# vectors already imported at test-vectors/aead/aes256gcm-nist.json.
# `default-features = false`, `features = ["aes", "alloc"]` explicitly
# selects only the AES block-cipher backend and `alloc`-based buffer support
# — `aes-gcm`'s optional `getrandom` feature (which would pull in a CSPRNG
# dependency for nonce generation) is NOT enabled; no random-number source is
# adopted in this stage (docs/fedos_core_rust_safety.md §7,
# docs/rust_dependency_adoption.md §6), same explicit-opt-out treatment as
# `chacha20poly1305` (Stage 74) and `argon2` (Stage 84). Wired to the NIST
# vectors ONLY inside a `#[cfg(test)]`-only module (Stage 101) — NOT
# imported/used anywhere in src/lib.rs's PRODUCTION code.
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc"] }

# `getrandom` (rust-random project, Apache-2.0 OR MIT) — the minimal CSPRNG
# entropy source a future, explicitly-reviewed stage would implement
# `randomBytes` (and, through it, AEAD nonce generation) against. Default
# features are used as-is on every NATIVE target this crate builds for — the
# default feature set reaches the OS's CSPRNG syscall directly, with no
# `std`-only gate this crate would need to opt out of. NOT imported/used
# ANYWHERE in `src/lib.rs` — production or `#[cfg(test)]` — this stage:
# dependency + build check only, exactly like every prior first-adoption stage
# (`chacha20poly1305` Stage 74, `hkdf` Stage 76, `argon2` Stage 84).
# `random_bytes_placeholder`/`fedos_random_boundary_status` are unchanged.
#
# Stage 442 adds the `wasm_js` feature (see
# `docs/runtime_wasm_getrandom_policy.md`, Stage 441): `getrandom` 0.3.x does
# NOT support `wasm32-unknown-unknown` by default, and this feature alone is
# INSUFFICIENT — a compiler `--cfg` flag is also required, which this
# `Cargo.toml` deliberately does NOT bake in (no `.cargo/config.toml` added).
# A `wasm32-unknown-unknown` build of this crate requires BOTH this feature
# AND passing, per-invocation:
#
#   RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo check --target wasm32-unknown-unknown
#
# `wasm_js` pulls in NO new direct dependency of this crate — the
# `wasm-bindgen`-based JS-interop shim it uses is entirely internal to
# `getrandom`'s own `Cargo.toml`, not a dependency this crate adds. Native
# targets are unaffected: `wasm_js` is a no-op unless both the feature AND
# the `--cfg` flag are in effect for a `wasm32*` target.
getrandom = { version = "0.3", features = ["wasm_js"] }

# `sha2` (RustCrypto, MIT OR Apache-2.0) — PROMOTED from `[dev-dependencies]`
# to `[dependencies]` in Stage 147 (the only `Cargo.toml` change in this
# batch). Originally added Stage 77 as a `[dev-dependencies]`-only concrete
# hash algorithm for the `#[cfg(test)]`-only `rfc5869_vectors` module to
# instantiate `Hkdf::<Sha256>` against the RFC 5869 vectors. `kdf_core`'s new
# internal HKDF-SHA256 implementation (Stage 147,
# `derive_secret_handle_internal`) needs that same concrete hash algorithm in
# PRODUCTION code — `hkdf`'s own API is generic over the hash function, so a
# concrete one is mandatory to call `Hkdf::<H>::new`/`.expand` at all. Default
# features are used as-is (`std`, no `asm` acceleration). Still not connected
# to any AEAD/NIP-44/Runtime/Worker/WASM path.
sha2 = "0.11.0"

# `k256` (RustCrypto, Apache-2.0 OR MIT) — the secp256k1 elliptic-curve
# implementation Stage 194 adopts per `docs/nip44_dependency_adoption.md`'s
# comparison (that document named `rust-secp256k1` and `k256` as the two
# candidates, picking neither; this Cargo.toml change is Stage 194's own,
# separate, explicitly-reviewed decision, resolving that document's §5
# open question in favor of `k256` — same RustCrypto organization, same
# Apache-2.0 OR MIT license, same pure-Rust/no-FFI/`no_std`-friendly shape
# as every dependency already listed above). `default-features = false` +
# `features = ["arithmetic"]` originally enabled ONLY field/group
# arithmetic — the minimum needed for a FUTURE ECDH stage to build on —
# and explicitly excluded `ecdsa` (signing/verification, not needed for
# NIP-44's ECDH-only usage), `schnorr` (BIP-340, a separate future
# Nostr-signing candidate, not that one), `serde` (this crate has never
# enabled `serde` in a PRODUCTION dependency —
# `docs/ciphertext_serialization_format_decision.md`), and `pem`/`pkcs8`
# (key-file-format encoding, not needed for an in-memory ECDH
# shared-secret computation).
#
# Secure Runtime Alpha 181–190 (the Nostr Schnorr Signing Foundation
# Arc) is the "separate future Nostr-signing candidate" the paragraph
# above named — this is that Stage, and it ADDS `"schnorr"` to the
# `features` list below. This is a Cargo FEATURE-FLAG change on the
# ALREADY-PRESENT `k256` dependency line, not a new `[dependencies]`
# entry — no new crate name is introduced. `k256::schnorr` (RustCrypto's
# own audited BIP-340 Taproot Schnorr implementation) is the ONLY
# reviewed alternative to hand-writing BIP-340's scalar/tagged-hash math
# by hand, which Secure Runtime Alpha 183 explicitly forbids ("No manual
# signing implementation"). `ecdsa`, `serde`, `pem`, `pkcs8`, `std`,
# `alloc`, and `rand` all remain excluded, unchanged from Stage 194's own
# original decision — see `docs/secure_runtime_alpha_181_k256_schnorr_api_inventory.md`
# for this Stage's own full record, and `src/crypto/secp256k1_dependency_guard.rs`
# for the updated, still-passing dependency-shape guard.
#
# REVIEWED EXCEPTION to `docs/rust_dependency_adoption.md` §12's "no
# `rand`/`rand_core` anywhere in the resolved graph" rule: `rand_core`
# (verified via `cargo tree -i rand_core`) appears as a REQUIRED,
# non-optional transitive dependency of `elliptic-curve`/`ff`/`group`/
# `crypto-bigint` — the trait crates `k256`'s `arithmetic` feature itself
# is built on — regardless of which `k256` feature flags are selected;
# this is an ecosystem-wide RustCrypto elliptic-curve trait requirement
# (e.g. `ff::Field`'s `random(rng)` trait method signature), not a `k256`-
# specific choice, and no version/feature combination of `k256` avoids it.
# `rand_core` itself is a TRAIT-ONLY crate (`RngCore`/`CryptoRng` trait
# definitions) with no actual entropy-source implementation of its own —
# unlike the full `rand` crate (still absent), it provides no
# `thread_rng()`/`OsRng` this crate could accidentally call instead of
# `getrandom::fill`. This exception is confirmed by the user and recorded
# here, in `docs/nip44_dependency_adoption.md`, and verified by a
# dedicated `cargo test` (`crypto::secp256k1_dependency_guard`, Stage 196)
# asserting `rand_core` is present ONLY as this specific transitive
# dependency, never as a direct dependency of this crate, and that the
# full `rand` crate remains entirely absent. NOT imported/used ANYWHERE in
# `src/lib.rs` or `src/crypto/` — production or `#[cfg(test)]` — this
# stage: dependency + build check only, exactly like every prior
# first-adoption stage. No ECDH function, no conversation-key derivation,
# no NIP-44 code of any kind exists yet — see
# `docs/nip44_dependency_adoption.md` (updated) for the full record.
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "schnorr"] }

# `wasm-bindgen` (rustwasm project, MIT OR Apache-2.0) — Prototype EXECUTION
# Phase 009's own, single, explicitly-reviewed adoption, per
# `docs/rust_dependency_adoption.md` §12's "one dependency per Stage"
# convention. Pinned to `0.2.126` to match the SAME version this crate's
# `wasm32-unknown-unknown` build graph already resolves to transitively (via
# `getrandom`'s own internal `wasm_js`-feature dependency, unaffected by this
# line — see `docs/runtime_wasm_bindgen_version_policy.md` §2) and the
# `wasm-bindgen-cli` binary this repository's `build:wasm` script already
# invokes at that same version (`docs/runtime_wasm_bindgen_version_policy.md`
# §1). Making it a DIRECT dependency (rather than only a transitive one) is
# the ONLY way the `#[wasm_bindgen]` proc-macro attribute becomes usable at
# all in `src/lib.rs` — this Stage adds ONLY the dependency line itself.
# `#[wasm_bindgen]` is NOT applied to any function this Stage — Rust public
# API remains unchanged at 27 `pub fn`, none annotated. No `version()` or any
# other new Rust function is added this Stage either. Default features are
# used as-is (`wasm-bindgen`'s own default feature set is the standard,
# minimal one every `wasm-bindgen`-generated JS glue in this repository's
# `packages/fedos-core-rust/pkg/` output already depends on). See
# `docs/runtime_wasm_rust_export_bindgen_dependency.md` for the full record.
wasm-bindgen = "0.2.126"

[dev-dependencies]
# Test-only plumbing (Stage 75) to read and assert against the RFC 8439
# vector JSON from `#[cfg(test)]` — none of these three crates is a
# production dependency and none is reachable from the crate's public API.
# `serde`/`serde_json` parse test-vectors/aead/chacha20poly1305-rfc8439.json
# into a Rust struct; `hex` decodes its hex-string fields into bytes.
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Still intentionally ABSENT from [dependencies] (production): the
# full `rand`/`rand_core` crates (only `getrandom` itself is adopted, Stage
# 104 — the minimal entropy source, not the higher-level `Rng`/`CryptoRng`
# trait ecosystem), bip39 / secp256k1 / nostr, wasm-bindgen. One crate per
# Stage (Stage 78's zeroize/secrecy/subtle trio is one reviewed group, not a
# bulk add — see docs/rust_dependency_adoption.md §12), each with its own
# recorded dependency review (docs/rust_dependency_adoption.md §1, §8).
