# FedOS Core — minimal Rust crate skeleton (Stage 69) + first dependency
# (Stage 74) + RFC 8439 vectors wired to `cargo test` (Stage 75).
#
# Placeholder crate. There is still NO cryptography and NO WASM here — the
# PUBLIC API in `src/lib.rs` is unchanged (placeholder functions only; see
# docs/rust_dependency_adoption.md). Stage 74 added exactly ONE production
# dependency, `chacha20poly1305` (RustCrypto). Stage 75 wires the RFC 8439
# vectors (test-vectors/aead/chacha20poly1305-rfc8439.json) to a `#[cfg(test)]`
# module in `src/lib.rs` that reads the vector file and asserts
# `chacha20poly1305` reproduces the official known answers — this is
# verification plumbing only; there is still no public encrypt/decrypt API and
# nothing outside `#[cfg(test)]` imports or calls the crate. Every other
# crypto crate (aes-gcm / hkdf / argon2), rand / getrandom, zeroize / secrecy /
# subtle, bip39 / secp256k1 / nostr, and wasm-bindgen remain ABSENT — each
# lands only in its own future, explicitly-reviewed, one-crate-per-stage
# adoption (docs/rust_dependency_adoption.md §1).

[package]
name = "fedos-core-rust"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# `rlib` only for now. NO `cdylib`/WASM target is declared until a future,
# explicitly-reviewed stage adds a real (audited) core and a build manifest.
crate-type = ["rlib"]

[dependencies]
# `chacha20poly1305` (RustCrypto, Apache-2.0 OR MIT) — the AEAD this crate will
# eventually implement against the RFC 8439 test vectors already imported at
# test-vectors/aead/chacha20poly1305-rfc8439.json. `default-features = false` +
# `features = ["alloc"]` explicitly excludes the crate's default `getrandom`
# feature (its default-feature OS-RNG convenience) — no random-number source is
# adopted in this stage; CSPRNG adoption is its own future, separate stage
# (docs/fedos_core_rust_safety.md §7, docs/rust_dependency_adoption.md §6).
# NOT imported/used anywhere in src/lib.rs yet — dependency + build check only.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Test-only plumbing (Stage 75) to read and assert against the RFC 8439
# vector JSON from `#[cfg(test)]` — none of these three crates is a
# production dependency and none is reachable from the crate's public API.
# `serde`/`serde_json` parse test-vectors/aead/chacha20poly1305-rfc8439.json
# into a Rust struct; `hex` decodes its hex-string fields into bytes.
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Still intentionally ABSENT from [dependencies] (production): aes-gcm, hkdf,
# argon2, rand / getrandom, zeroize / secrecy / subtle, bip39 / secp256k1 /
# nostr, wasm-bindgen. One crate per Stage, each with its own recorded
# dependency review (docs/rust_dependency_adoption.md §1, §8).
