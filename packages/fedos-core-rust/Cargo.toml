# FedOS Core — minimal Rust crate skeleton (Stage 69) + first dependency (Stage 74).
#
# Placeholder crate. There is still NO cryptography and NO WASM here — `src/lib.rs`
# is unchanged (placeholder functions only; see docs/rust_dependency_adoption.md).
# Stage 74 adds exactly ONE dependency, `chacha20poly1305` (RustCrypto), so a
# FUTURE, explicitly-reviewed stage can wire the RFC 8439 vectors
# (test-vectors/aead/chacha20poly1305-rfc8439.json) to `cargo test` and, later,
# implement real AEAD behind this crate's placeholder API. That crate is not
# imported, called, or exercised anywhere in this crate yet. Every other crypto
# crate (aes-gcm / hkdf / argon2), rand / getrandom, zeroize / secrecy / subtle,
# bip39 / secp256k1 / nostr, and wasm-bindgen remain ABSENT — each lands only in
# its own future, explicitly-reviewed, one-crate-per-stage adoption
# (docs/rust_dependency_adoption.md §1).

[package]
name = "fedos-core-rust"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# `rlib` only for now. NO `cdylib`/WASM target is declared until a future,
# explicitly-reviewed stage adds a real (audited) core and a build manifest.
crate-type = ["rlib"]

[dependencies]
# `chacha20poly1305` (RustCrypto, Apache-2.0 OR MIT) — the AEAD this crate will
# eventually implement against the RFC 8439 test vectors already imported at
# test-vectors/aead/chacha20poly1305-rfc8439.json. `default-features = false` +
# `features = ["alloc"]` explicitly excludes the crate's default `getrandom`
# feature (its default-feature OS-RNG convenience) — no random-number source is
# adopted in this stage; CSPRNG adoption is its own future, separate stage
# (docs/fedos_core_rust_safety.md §7, docs/rust_dependency_adoption.md §6).
# NOT imported/used anywhere in src/lib.rs yet — dependency + build check only.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }

# Still intentionally ABSENT: aes-gcm, hkdf, argon2, rand / getrandom, zeroize /
# secrecy / subtle, bip39 / secp256k1 / nostr, wasm-bindgen. One crate per
# Stage, each with its own recorded dependency review
# (docs/rust_dependency_adoption.md §1, §8).
