<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>FedOS Desktop Conversation Window</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
  #conversation-list { width: 260px; overflow-y: auto; border-right: 1px solid #ccc; padding: 8px; box-sizing: border-box; }
  #conversation-list li { cursor: pointer; padding: 4px; list-style: none; }
  #conversation-list li[data-pinned="true"]::before { content: "\2605 "; }
  #main { flex: 1; padding: 12px; display: flex; flex-direction: column; }
  #toolbar button { margin-right: 6px; }
  #detail { margin-top: 12px; white-space: pre-wrap; }
  #status { color: #a00; }
</style>
</head>
<body>
<ul id="conversation-list" data-testid="conversation-list"></ul>
<div id="main">
  <div id="toolbar">
    <button id="back-btn" data-testid="back-btn">&larr; Back</button>
    <button id="forward-btn" data-testid="forward-btn">Forward &rarr;</button>
    <button id="close-btn" data-testid="close-btn">Close</button>
    <button id="pin-btn" data-testid="pin-btn">Pin/Unpin</button>
    <button id="new-window-btn" data-testid="new-window-btn">New Window</button>
    <button id="refresh-list-btn" data-testid="refresh-list-btn">Refresh List</button>
  </div>
  <h1 id="window-title" data-testid="window-title">FedOS</h1>
  <div id="navigation-state" data-testid="navigation-state"></div>
  <div id="detail" data-testid="detail"></div>
  <div id="status" data-testid="status"></div>
</div>
<script src="fedos_electron_navigation_renderer.js"></script>
</body>
</html>
